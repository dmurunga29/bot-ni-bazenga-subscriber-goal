
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
  }

  body {
    font-family: Impact, "Arial Narrow", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .goal {
    position: relative;
    width: 100%;
    min-width: 280px;
    padding: 16px 22px 19px;
    overflow: visible;
    color: #fff;
    background: rgba(5, 6, 8, 0.97);
    border: 1px solid rgba(255, 45, 65, 0.85);
    border-radius: 8px;
    box-shadow: 0 0 16px rgba(255, 30, 50, 0.12);
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 2px 3px #000;
  }

  .label {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 7px;
    height: 7px;
    flex: 0 0 7px;
    border-radius: 50%;
    background: #ff3048;
    box-shadow: 0 0 8px #ff3048;
  }

  .target {
    color: #fff;
    font: 700 12px Arial, sans-serif;
    letter-spacing: 1px;
    text-shadow: 0 2px 3px #000;
  }

  .count {
    text-align: center;
    white-space: nowrap;
    font-size: clamp(34px, 5vw, 64px);
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: -1px;
    color: #fff;
    -webkit-text-stroke: 1px #fff;
    paint-order: stroke fill;
    text-shadow:
      0 3px 0 #000,
      2px 0 #000,
      -2px 0 #000,
      0 -2px #000,
      0 0 8px rgba(255, 45, 65, 0.65);
  }

  .track {
    position: relative;
    height: 12px;
    margin-top: 18px;
    border-radius: 20px;
    background: #35151b;
    border: 1px solid #60202a;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.9);
    isolation: isolate;
  }

  .fill {
    position: relative;
    height: 100%;
    width: 50.1%;
    border-radius: 20px;
    background: linear-gradient(180deg, #ff7b89 0%, #ff263f 48%, #d90024 100%);
    box-shadow: 0 0 5px #ff263f;
  }

  /* The glow pulses on the red progress bar only. */
  .fill::before {
    content: "";
    position: absolute;
    z-index: -1;
    left: -5px;
    right: -5px;
    top: -9px;
    bottom: -9px;
    border-radius: 30px;
    background: #ff1838;
    filter: blur(12px);
    opacity: .75;
    animation: barGlow 1.8s ease-in-out infinite;
  }

  .fill::after {
    content: "";
    position: absolute;
    left: 5px;
    right: 5px;
    top: 2px;
    height: 2px;
    border-radius: 10px;
    background: rgba(255,255,255,.85);
  }

  @keyframes barGlow {
    0%, 100% {
      opacity: .35;
      filter: blur(8px);
      box-shadow: 0 0 8px 2px rgba(255, 25, 55, .65);
    }
    50% {
      opacity: 1;
      filter: blur(15px);
      box-shadow: 0 0 22px 7px rgba(255, 25, 55, .95);
    }
  }

  .bottom {
    margin-top: 10px;
    text-align: center;
    color: #ff3048;
    font: 900 12px Arial, sans-serif;
    letter-spacing: 2px;
    text-shadow: 0 2px 3px #000;
  }

  .status {
    display: none;
    margin-top: 5px;
    text-align: center;
    color: #fff;
    font: 700 11px Arial, sans-serif;
    text-shadow: 0 2px 4px #000;
  }

  @media (prefers-reduced-motion: reduce) {
    .fill::before { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <section class="goal" aria-label="Subscriber goal">
    <div class="top">
      <div class="label"><span class="dot"></span><span>SUB GOAL</span></div>
      <div class="target" id="target-label">1,000 GOAL</div>
    </div>

    <div class="count">
      <span id="current">501</span> / <span id="goal-number">1,000</span>
    </div>

    <div class="track">
      <div class="fill" id="fill"></div>
    </div>

    <div class="bottom" id="percent">50.1% COMPLETE</div>
    <div class="status" id="status"></div>
  </section>
</div>

<script>
const GOAL = 1000;

function render(count) {
  count = Math.max(0, Number(count) || 0);
  const percent = Math.min(100, count / GOAL * 100);

  document.getElementById("current").textContent =
    Math.floor(count).toLocaleString("en-US");
  document.getElementById("goal-number").textContent =
    GOAL.toLocaleString("en-US");
  document.getElementById("target-label").textContent =
    GOAL.toLocaleString("en-US") + " GOAL";
  document.getElementById("fill").style.width = percent + "%";
  document.getElementById("percent").textContent =
    percent.toFixed(1) + "% COMPLETE";
}

async function update() {
  const status = document.getElementById("status");

  try {
    const response = await fetch("/.netlify/functions/subscribers", {
      cache: "no-store"
    });
    if (!response.ok) throw new Error("Subscriber service unavailable");

    const data = await response.json();
    if (typeof data.subscriberCount !== "number") {
      throw new Error("Subscriber count unavailable");
    }

    render(data.subscriberCount);
    status.style.display = "block";
    status.textContent = data.rounded
      ? "LIVE • YouTube public count (rounded)"
      : "LIVE • YouTube subscriber count";
  } catch (error) {
    status.style.display = "block";
    status.textContent = "LIVE COUNT TEMPORARILY UNAVAILABLE";
  }
}

render(501);
update();
setInterval(update, 120000);
</script>
</body>
</html>
